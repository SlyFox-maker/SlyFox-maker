<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Egor Pavlov - Portfolio</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
        <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
        <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css" />
        <script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
        <link rel="stylesheet" href="./src/styles.css" />

        <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfobject/2.2.8/pdfobject.min.js"></script>
    </head>
    <body>
        <div id="app">
            <nav class="navbar navbar-expand-lg navbar-dark">
                <a class="navbar-brand" href="#">Egor Pavlov</a>
                <div class="ml-auto">
                    <button v-for="language in supportedLangs" :key="'lang-' + language" class="btn btn-sm btn-outline-info mx-1" @click="setLang(language)">{{ language.toUpperCase() }}</button>
                </div>
            </nav>

            <div class="container py-5 animate__animated animate__fadeIn">
                <div class="d-flex align-items-center mb-4">
                    <img src="./src/avatar.png" alt="Egor Pavlov" class="rounded-circle neon-glow mr-3" />
                    <h1 ref="title" id="title" class="display-4 neon-text mb-0">{{ t('title') }}</h1>
                </div>
                <p ref="intro" class="lead">{{ t('intro') }}</p>

                <section class="my-5 skills">
                    <h2 ref="skills" class="h4 border-bottom border-info pb-2">{{ t('skills') }}</h2>
                    <ul ref="skillsList"></ul>
                </section>
                <section id="degrees" class="my-5">
                    <h2 ref="degree" class="h4 border-bottom border-info pb-2">{{ t('degree') }}</h2>

                    <p ref="degree_text">{{ t('degree_text') }}</p>
                </section>
                <section id="certificates" class="my-5">
                    <h2 class="h4 border-bottom border-info pb-2 section-title">{{ t('certs') }}</h2>
                    <div class="certificates-grid">
                        <div ref="certs" class="cert-card" v-for="(cert, index) in currentTranslations.certs_list" :key="'cert-' + index" @click="openImage(cert)" tabindex="0" @keydown.enter.prevent="openImage(cert)" role="button" :title="cert.name">{{ cert.name }}</div>
                    </div>
                </section>

                <section id="projects" class="my-5">
                    <h2 class="h4 border-bottom border-info pb-2 section-title">{{ t('projects') }}</h2>
                    <div ref="projects" class="project-card" v-for="(project, index) in currentTranslations.project_list" :key="'project-' + index" @click="openImageProject(project)" tabindex="0" @keydown.enter.prevent="openImageProject(project)" role="button" :title="project.name">{{ project.name }}</div>
                </section>

                <div class="contact-info">
                    <a v-for="(contact, index) in contacts" :key="'contact-' + index" :href="contact.href" target="_blank" rel="noopener" class="contact-btn">
                        <span class="contact-icon"><i :class="contact.iconClass"></i></span>
                        <span class="contact-text">{{ contact.label }}</span>
                    </a>
                </div>

                <!-- Модалка -->
                <!-- Модалка для сертификатов -->
                <div id="modal" class="modal" v-show="modalVisible" @click.self="startClose" :class="{ 'modal-visible': modalVisible }">
                    <div class="modal-content" :class="animationClass" @animationend="onAnimationEnd">
                        <button class="modal-close" @click="startClose">&times;</button>
                        <div class="modal-body">
                            <div class="image-container">
                                <img :src="modalImage" alt="Certificate" class="modal-img" />
                            </div>
                            <div class="modal-desc" ref="descText"></div>
                        </div>
                    </div>
                </div>
                <!-- Модалка -->
                <!-- Модалка для проектов (галерея) -->
                <div id="project-modal" class="modal" v-show="projectModalVisible" @click.self="closeProjectModal" :class="{ 'modal-visible': projectModalVisible }">
                    <div class="modal-content" :class="animationClass" @animationend="onAnimationEnd">
                        <button class="modal-close" @click="closeProjectModal">&times;</button>

                        <div class="modal-body">
                            <!-- Левая часть - галерея -->
                            <div class="gallery-side">
                                <!-- Основное изображение -->
                                <img :src="projectModalImages[projectModalIndex]" :alt="'Project image ' + (projectModalIndex + 1)" class="gallery-main-img" @click="lightbox.openAt(projectModalIndex)" />

                                <!-- Миниатюры -->
                                <div class="gallery-thumbnails">
                                    <img v-for="(img, idx) in projectModalImages" :key="idx" :src="img" :alt="'Thumbnail ' + (idx + 1)" class="gallery-thumb" :class="{ active: idx === projectModalIndex }" @click="goToImage(idx)" />
                                </div>
                            </div>

                            <!-- Правая часть - описание -->
                            <div class="modal-desc" ref="projectDescText">{{ projectModalDesc }}</div>
                        </div>
                    </div>
                </div>

                <footer class="text-center mt-5 pt-3 border-top border-info">
                    <small>© 2025 Egor Pavlov — <a href="https://github.com/SlyFox-maker/SlyFox-maker" target="_blank">GitHub</a></small>
                </footer>
            </div>
        </div>

        <script src="./src/content.js"></script>

        <script src="./src/animations.js"></script>
        <script src="./src/app.js"></script>

        <div id="particles-js"></div>

        <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
        <script src="./src/particles.js"></script>
    </body>
</html>
